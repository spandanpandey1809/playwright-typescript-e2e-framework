name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "15 4 * * *"   # every day at 09:45 IST
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Each shard runs half of the tests; the blob reports are merged below
      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # A missing or changed screenshot baseline is written next to the test; keep it for review
      - name: Upload new visual baselines
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-baselines-${{ matrix.shardIndex }}
          path: tests/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 3

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # Only main-branch runs (push, nightly, manual) publish the live report
      - name: Package report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

  publish-report:
    name: Publish report to GitHub Pages
    needs: merge-reports
    if: ${{ !cancelled() && needs.merge-reports.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    # Publishing the report must never turn the test pipeline red
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy report
        id: deploy
        uses: actions/deploy-pages@v4

  docker:
    name: API tests in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build the test image
        run: docker build -t pw-tests .

      # Light suite only: the full suite already runs above against the same public site
      - name: Run API tests in the container
        run: docker run --rm -v "$PWD/test-results:/tests/test-results" pw-tests
